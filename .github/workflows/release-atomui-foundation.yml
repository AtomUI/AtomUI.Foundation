name: AtomUI.Foundation Release Pipeline

on:
  push:
    branches:
      - release/1.0
    paths:
      - .github/workflows/release-atomui-foundation.yml
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch, tag, or exact commit SHA to build'
        type: string
        default: 'release/1.0'
      build_configuration:
        description: 'Build configuration'
        type: string
        default: 'Release'
      publish_to_nuget:
        description: 'Publish to nuget.org'
        type: boolean
        default: false

env:
  SOURCE_DIR: ${{ github.workspace }}
  PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/Nuget
  BUILD_CONFIGURATION: ${{ github.event.inputs.build_configuration || 'Release' }}
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || github.ref_name }}

jobs:
  BuildAtomUIFoundationNuget:
    name: Build AtomUI.Foundation NuGet packages
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build AtomUI.Foundation solution
        shell: pwsh
        run: |
          dotnet build --configuration $env:BUILD_CONFIGURATION ./AtomUI.Foundation.slnx

      - name: Test AtomUI.Foundation
        shell: pwsh
        run: |
          dotnet test ./tests/AtomUI.Foundation.Tests/AtomUI.Foundation.Tests.csproj --framework net10.0 --configuration $env:BUILD_CONFIGURATION --no-build

      - name: Test AtomUI.Foundation.Generator
        shell: pwsh
        run: |
          dotnet test ./tests/AtomUI.Foundation.Generator.Tests/AtomUI.Foundation.Generator.Tests.csproj --framework net10.0 --configuration $env:BUILD_CONFIGURATION --no-build

      - name: Verify real ProjectReference and NuGet consumers
        shell: pwsh
        run: |
          # JIT consumers and the .NET 8 SDK analyzer load run here; trim and Native AOT are
          # covered by the Linux verification workflow required below before publishing.
          python tests/fixtures/generator-consumer/verify.py --mode all --case all --sdk8-loader --work-dir .artifacts/release-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require successful verification for the target commit
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_nuget == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $count = gh api "repos/${{ github.repository }}/actions/workflows/verify.yml/runs?head_sha=$sha&status=success" --jq ".total_count"
          if ($LASTEXITCODE -ne 0) { throw "Could not query verification runs for $sha." }
          if ([int]$count -lt 1) {
            throw "Foundation Verification has not succeeded for $sha; publishing requires it."
          }

      - name: Create AtomUI.Foundation NuGet packages
        shell: pwsh
        run: |
          $projects = @(
            "./src/AtomUI.Foundation/AtomUI.Foundation.csproj",
            "./src/AtomUI.Foundation.Generator/AtomUI.Foundation.Generator.csproj"
          )
          foreach ($project in $projects) {
            dotnet pack --no-build --output "$env:PACKAGE_OUTPUT_DIR/$env:BUILD_CONFIGURATION" --configuration $env:BUILD_CONFIGURATION $project
          }

      - name: Validate NuGet artifacts
        shell: pwsh
        run: |
          [xml]$versionProps = Get-Content "$env:SOURCE_DIR/build/Version.props"
          $version = $versionProps.Project.PropertyGroup.AtomUIFoundationVersion
          $packageDirectory = "$env:PACKAGE_OUTPUT_DIR/$env:BUILD_CONFIGURATION"
          $expectedPackages = @(
            "AtomUI.Foundation.$version.nupkg",
            "AtomUI.Foundation.Generator.$version.nupkg"
          )
          $actualPackages = @(Get-ChildItem -Path $packageDirectory -Filter *.nupkg -File)
          if ($actualPackages.Count -ne $expectedPackages.Count) {
            throw "Expected exactly $($expectedPackages.Count) NuGet packages, found $($actualPackages.Count)."
          }
          $expectedCommit = (git rev-parse HEAD).Trim()
          foreach ($packageName in $expectedPackages) {
            $packagePath = Join-Path -Path $packageDirectory -ChildPath $packageName
            if (-not (Test-Path -Path $packagePath -PathType Leaf)) {
              throw "Expected NuGet package not found: $packageName"
            }
            $packageId = $packageName.Substring(0, $packageName.Length - ".$version.nupkg".Length)
            $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
            try {
              $entries = @($archive.Entries.FullName)
              $requiredAssets = @("README.md", "LICENSE", "logo.png")
              if ($packageId -eq "AtomUI.Foundation") {
                $requiredAssets += "lib/net8.0/AtomUI.Foundation.dll", "lib/net10.0/AtomUI.Foundation.dll"
              } else {
                $requiredAssets += "analyzers/dotnet/cs/AtomUI.Foundation.Generator.dll", "buildTransitive/AtomUI.Foundation.Generator.props"
                if (@($entries | Where-Object { $_.StartsWith("lib/") }).Count -ne 0) {
                  throw "Generator package contains an unexpected lib asset."
                }
              }
              foreach ($asset in $requiredAssets) {
                if ($entries -notcontains $asset) { throw "Missing $asset in $packageName" }
              }
              $reader = [System.IO.StreamReader]::new($archive.GetEntry("$packageId.nuspec").Open())
              try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if ($nuspec.package.metadata.id -ne $packageId -or $nuspec.package.metadata.version -ne $version) {
                throw "Unexpected identity or version in $packageName"
              }
              if ($nuspec.package.metadata.repository.commit -ne $expectedCommit) {
                throw "Package $packageName does not identify validated commit $expectedCommit"
              }
            } finally { $archive.Dispose() }
          }

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v6
        with:
          name: NuGetPackages
          path: ${{ env.PACKAGE_OUTPUT_DIR }}/${{ env.BUILD_CONFIGURATION }}/*.nupkg
          include-hidden-files: true

      - name: Publish to nuget.org
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_nuget == 'true' }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ($env:BUILD_CONFIGURATION -ne "Release") {
            throw "Publishing requires Release configuration."
          }
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "The repository NUGET_API_KEY secret is not configured."
          }
          [xml]$versionProps = Get-Content "$env:SOURCE_DIR/build/Version.props"
          $version = $versionProps.Project.PropertyGroup.AtomUIFoundationVersion
          $packageDirectory = "$env:PACKAGE_OUTPUT_DIR/$env:BUILD_CONFIGURATION"
          $packageIds = @("AtomUI.Foundation", "AtomUI.Foundation.Generator")
          foreach ($packageId in $packageIds) {
            $normalizedPackageId = $packageId.ToLowerInvariant()
            $versionIndex = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$normalizedPackageId/index.json"
            if ($versionIndex.versions -contains $version) {
              throw "NuGet package version already exists: $packageId $version"
            }
          }
          foreach ($packageId in $packageIds) {
            $packagePath = Join-Path -Path $packageDirectory -ChildPath "$packageId.$version.nupkg"
            try {
              dotnet nuget push $packagePath --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
              Write-Output "Published NuGet package: $packageId $version"
            }
            catch {
              Write-Error "Publish $packageId $version error: $_"
              exit 1
            }
          }
